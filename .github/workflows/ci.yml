name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Performance budgets (×2 slack on shared runners)
        run: pnpm bench --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/results/*.ci.json
          if-no-files-found: ignore
      - name: Webview UI tests (Playwright, Chromium)
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:webview
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: webview-screenshots-and-gate
          path: |
            test-results/
            bench/results/webview.*.ci.json
          if-no-files-found: ignore
      - name: Integration tests (VS Code stable)
        if: runner.os != 'Linux'
        run: pnpm test:integration
      - name: Integration tests (VS Code stable, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:integration

  min-vscode:
    name: VS Code 1.95.0 (engines minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:integration
        env:
          VSCODE_VERSION: 1.95.0
